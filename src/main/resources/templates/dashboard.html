<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #f4f6f9;
        }

        .topo{
            width: 100%;
            height: 70px;
            background-color: #1e293b;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .topo h1{
            font-size: 24px;
        }

        .usuario{
            font-size: 18px;
            font-weight: bold;
        }

        .container{
            padding: 30px;
        }

        .acoes{
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .acoes button{
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            background-color: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            transition: 0.3s;
        }

        .acoes button:hover{
            background-color: #1d4ed8;
        }

        .card{
            background-color: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        .card h2{
            margin-bottom: 20px;
            color: #1e293b;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        table th{
            background-color: #e2e8f0;
            padding: 14px;
            text-align: left;
        }

        table td{
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        .status{
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .ativo{
            background-color: #dcfce7;
            color: #166534;
        }

        .encerrado{
            background-color: #fee2e2;
            color: #991b1b;
        }

    </style>

</head>
<body>

    <!-- TOPO -->
    <div class="topo">

        <h1>Sistema de Sorteio</h1>

        <div class="usuario">
            Usuário:
            <span th:text="${usuario.nome}">
                Pedro
            </span>
        </div>

    </div>

    <!-- CONTEÚDO -->
    <div class="container">

        <!-- BOTÕES -->
        <div class="acoes">

            <button>
                Cadastrar Edital
            </button>

            <button>
                Editar Edital
            </button>

            <button>
                Realizar Sorteio
            </button>

        </div>

        <!-- LISTA DE EDITAIS -->
        <div class="card">

            <h2>Editais Cadastrados</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="edital : ${editais}">

                        <td th:text="${edital.id}">
                            1
                        </td>

                        <td th:text="${edital.titulo}">
                            Edital Educação 2026
                        </td>

                        <td th:text="${edital.data}">
                            20/05/2026
                        </td>

                        <td>

                            <span
                                th:text="${edital.status}"
                                th:classappend="${edital.status == 'ATIVO'} ? 'ativo' : 'encerrado'"
                                class="status">

                                ATIVO

                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
