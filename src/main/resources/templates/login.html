<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>

<h1>Login</h1>

<form th:action="@{/login}" method="post">

    <label>Matrícula</label>
    <input type="text" name="matricula">

    <br><br>

    <label>Senha</label>
    <input type="password" name="senha">

    <br><br>

    <button type="submit">
        Entrar
    </button>

</form>

<p th:if="${erro}"
   th:text="${erro}">
</p>

</body>
</html>
